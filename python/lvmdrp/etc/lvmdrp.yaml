
quick: false
reduction_steps:
  preproc_raw_frame:
    default:
      subtract_overscan: true
  find_peaks_auto:
    pixel_range: [20, 4000]
    fibers_dmin: 5
    threshold: 1.0
    method: hyperbolic
    median_box: [1, 10]
  trace_peaks:
    steps: 30
    coadd: 5
    threshold: 0.5
    max_diff: 1
    method: gauss
    median_box: 10
    median_cross: 1
    poly_disp: 5
  extract_spectra:
    default:
      method: aperture
      aperture: 4
      parallel: auto
  determine_wavesol:
    default:
      ref_fiber: 319
      poly_disp: 3
      poly_fwhm: 3
      poly_cros: 3
      poly_kinds: ['poly', 'poly', 'poly']
      aperture: 10
      flux_min: 0.001
      fwhm_max: 5.0
      rel_flux_limits: [0.01, 1]
  resample_wave:
    default:
      disp_pix: 1.0
      method: linear
      err_sim: 10
      parallel: auto
      extrapolate: true
  science_reduction:
    default:
      # sky subtraction: one of functions/skyMethod.SKY_METHODS (overridden by
      # `drp run --sky-method`); the decomp_* methods need a sky-data directory,
      # $LVM_MASTER_DIR/sky_models/<sky_model_version>, or sky_data_dir if given.
      # sky_model_version is the default sky data for this lvmdrp release: version
      # directories are never modified, so a new data set or model is a new
      # version (drp<DRP version of the training data>-v<N>) and a change here.
      skymethod: farlines_nearcont
      sky_model_version: drp1.3.2-v1
      sky_data_dir: null
      sky_options:
        decompose_science: true   # decomp_*: also decompose the science spectrum
        sky_lsf: sci              # mlsky: LSF for the sky telescopes, sci (as in training) or own
        arm_correction: true      # mlsky: sky-arm residual correction (blue solar lines)
        line_scaling: true        # mlsky: refit sky-line scales on the science spectrum
